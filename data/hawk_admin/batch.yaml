defaults:
  materialType: "图片"
  config: '{"stages":[]}'
  missingId: 999999999
  statisticsCollectionId: "999999999"

cases:
  create:
    - id: default_init
      inputFilePath: "CID://966"
    - id: name_check
      inputFilePath: "CID://966"
    - id: list_filter
      inputFilePath: "CID://966"
    - id: update_input
      inputFilePath: "CID://966"
      # 仍指向同一圈选集，但保留不同的合法 CID 表示，用于验证写后读回。
      updatedInputFilePath: "CID://000966"
    - id: status_update
      inputFilePath: "CID://966"
    - id: invalid_status
      inputFilePath: "CID://966"
    - id: delete
      inputFilePath: "CID://966"
    - id: cid_input
      inputFilePath: "CID://966"

  invalid_create:
    - id: without_project
      projectId: 0
      inputFilePath: "CID://966"
      name: "TC-05-02-no-project"
    - id: missing_flow
      projectId: null
      flowName: "flow-not-exist-20260902"
      inputFilePath: "CID://966"
      name: "TC-05-03-no-flow"

  invalid_status:
    - id: negative
      status: -1
    - id: unsupported
      status: 999

  auxiliary_invalid_write:
    - id: empty_statistics
      endpoint: batch_statistics
      payload: {}
    - id: empty_upload
      endpoint: upload_file
      payload: ""
    - id: empty_multipart_init
      endpoint: init_multipart_upload
      payload: {}
    - id: empty_multipart_complete
      endpoint: complete_multipart_upload
      payload: {}
