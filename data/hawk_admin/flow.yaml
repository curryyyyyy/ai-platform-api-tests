defaults:
  alias: "automation-flow-draft"
  desc: "自动化接口测试流程草稿"

cases:
  create:
    - id: valid
      desc: "创建流程草稿"

  invalid_create:
    - id: missing_project_id
      projectId: ""
    - id: invalid_project_id
      projectId: "not-a-number"

  update:
    - id: standard
      alias: "flow01-updated"
      desc: "更新流程"

  read:
    - id: stage_status_sort
      page: 1
      pageSize: 5
      stageName: "kuaishou_ip_delivery.extract"
      sortField: "callCnt30d"
      sortOrder: "desc"
      status: 2
    - id: call_count_sort
      page: 1
      pageSize: 30
      sortField: "callCnt30d"
      sortOrder: "desc"
      canOffline: false
