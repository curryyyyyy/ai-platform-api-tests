defaults:
  missing_collection_id: 999999999
  missing_source_collection_id: 999999999
  missing_task_id: 999999999
  invalid_node_type: 99
  valid_table_env: "SOURCE_ADMIN_TABLE_NAME"
  composite_table_env: "SOURCE_ADMIN_COMPOSITE_TABLE_NAME"
  composite_node_type_env: "SOURCE_ADMIN_COMPOSITE_NODE_TYPE"
  writable_collection_env: "SOURCE_ADMIN_WRITABLE_COLLECTION_ID"
  query_collection_env: "SOURCE_ADMIN_QUERY_COLLECTION_ID"
  download_collection_env: "SOURCE_ADMIN_DOWNLOAD_COLLECTION_ID"
  statistics_collection_env: "SOURCE_ADMIN_STATISTICS_COLLECTION_ID"
  statistics_timeout_env: "SOURCE_ADMIN_STATISTICS_TIMEOUT"
  statistics_poll_interval_env: "SOURCE_ADMIN_STATISTICS_POLL_INTERVAL"

cases:
  invalid_original_download:
    - id: unsupported_type
      type: 99
      rowkeys: ["api-test-rowkey"]
    - id: empty_rowkeys
      type: 2
      rowkeys: []
  invalid_set_operation:
    - id: unsupported_operation
      operation: 99
      a_collection_ids: []
      b_collection_ids: []
  invalid_import:
    - id: empty_payload
      payload: {}
  invalid_csv:
    - id: missing_tos_path
      payload: {}
  invalid_create_from_rowkeys:
    - id: blank_name
      parent_node_id: 1
      name: ""
      cid: 1
      rowkeys: ["api-test-rowkey"]
    - id: invalid_parent_node
      parent_node_id: 0
      name: "api-test-rowkey-collection"
      cid: 1
      rowkeys: ["api-test-rowkey"]
    - id: invalid_source_collection
      parent_node_id: 1
      name: "api-test-rowkey-collection"
      cid: 0
      rowkeys: ["api-test-rowkey"]
    - id: empty_rowkeys
      parent_node_id: 1
      name: "api-test-rowkey-collection"
      cid: 1
      rowkeys: []
    - id: rowkeys_over_limit
      parent_node_id: 1
      name: "api-test-rowkey-collection"
      cid: 1
      rowkey_count: 100001
  invalid_temporary_query:
    - id: empty_payload
      payload: {}
    - id: blank_sql
      sql: ""
      name: "api-test-temporary-query"
      config_snapshot: "{}"
      table_name: "image"
    - id: blank_name
      sql: "SELECT rowkey FROM image"
      name: ""
      config_snapshot: "{}"
      table_name: "image"
    - id: blank_config_snapshot
      sql: "SELECT rowkey FROM image"
      name: "api-test-temporary-query"
      config_snapshot: ""
      table_name: "image"
    - id: blank_table_name
      sql: "SELECT rowkey FROM image"
      name: "api-test-temporary-query"
      config_snapshot: "{}"
      table_name: ""
    - id: invalid_from_collection
      sql: "SELECT rowkey FROM image"
      name: "api-test-temporary-query"
      config_snapshot: "{}"
      table_name: "image"
      from_collection_id: 0
  statistics_auth:
    - id: submit_requires_login
      endpoint: submit
    - id: preview_requires_login
      endpoint: preview
    - id: query_requires_login
      endpoint: query
    - id: export_requires_login
      endpoint: export
    - id: page_without_login
      endpoint: page
  invalid_statistics:
    - id: submit_missing_fields
      endpoint: submit
      collection_id: 0
      fields: []
    - id: preview_missing_fields
      endpoint: preview
      collection_id: 0
      fields: []
    - id: query_missing_id
      endpoint: query
      query_id: ""
    - id: export_missing_id
      endpoint: export
      query_id: ""
