defaults:
  missing_collection_id: 999999999
  missing_source_collection_id: 999999999
  missing_task_id: 999999999
  invalid_node_type: 99
  valid_table_env: "SOURCE_ADMIN_TABLE_NAME"
  writable_collection_env: "SOURCE_ADMIN_WRITABLE_COLLECTION_ID"
  query_collection_env: "SOURCE_ADMIN_QUERY_COLLECTION_ID"

cases:
  invalid_original_download:
    - id: unsupported_type
      type: 99
      rowkeys: ["api-test-rowkey"]
    - id: empty_rowkeys
      type: 2
      rowkeys: []
  invalid_set_operation:
    - id: unsupported_operation
      operation: 99
      a_collection_ids: []
      b_collection_ids: []
  invalid_import:
    - id: empty_payload
      payload: {}
  invalid_csv:
    - id: missing_tos_path
      payload: {}
  invalid_create_from_rowkeys:
    - id: blank_name
      parent_node_id: 1
      name: ""
      cid: 1
      rowkeys: ["api-test-rowkey"]
    - id: invalid_parent_node
      parent_node_id: 0
      name: "api-test-rowkey-collection"
      cid: 1
      rowkeys: ["api-test-rowkey"]
    - id: invalid_source_collection
      parent_node_id: 1
      name: "api-test-rowkey-collection"
      cid: 0
      rowkeys: ["api-test-rowkey"]
    - id: empty_rowkeys
      parent_node_id: 1
      name: "api-test-rowkey-collection"
      cid: 1
      rowkeys: []
    - id: rowkeys_over_limit
      parent_node_id: 1
      name: "api-test-rowkey-collection"
      cid: 1
      rowkey_count: 100001
  invalid_temporary_query:
    - id: empty_payload
      payload: {}
    - id: blank_sql
      sql: ""
      name: "api-test-temporary-query"
      config_snapshot: "{}"
      table_name: "image"
    - id: blank_name
      sql: "SELECT rowkey FROM image"
      name: ""
      config_snapshot: "{}"
      table_name: "image"
    - id: blank_config_snapshot
      sql: "SELECT rowkey FROM image"
      name: "api-test-temporary-query"
      config_snapshot: ""
      table_name: "image"
    - id: blank_table_name
      sql: "SELECT rowkey FROM image"
      name: "api-test-temporary-query"
      config_snapshot: "{}"
      table_name: ""
    - id: invalid_from_collection
      sql: "SELECT rowkey FROM image"
      name: "api-test-temporary-query"
      config_snapshot: "{}"
      table_name: "image"
      from_collection_id: 0
