defaults:
  share_name: "API automation share"
  max_count: 0
  missing_link_id: 999999999
  missing_collection_id: 999999999

cases:
  lifecycle:
    - id: standard
      max_count: 10
  public_access:
    - id: missing_token
      share_token:
    - id: invalid_token
      share_token: "not-a-valid-share-token"
  page:
    - id: share_page_html
      path_token: "share-page-test-token"
      expected_content_type: "text/html"
      expected_cache_control: "no-cache"
  invalid_create:
    - id: expired_link
      expire_at: 1
