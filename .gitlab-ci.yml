stages:
  - contract
  - requirement
  - core
  - notify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

default:
  image: python:3.11
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_DEPTH: "0"

contract:
  stage: contract
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - python -m pip install .
    # 只使用仓库内已审核并提交的契约快照，不访问上游 GitLab。
    - ./scripts/run_tests.sh -m contract
  after_script:
    - mkdir -p reports/ci
    - if [ -f reports/junit/results.xml ]; then cp reports/junit/results.xml reports/ci/contract.xml; fi
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit/results.xml
    paths:
      - reports/

requirements_live:
  stage: requirement
  resource_group: api-requirements-live
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  needs:
    - job: contract
      artifacts: false
  script:
    - python -m pip install .
    - python scripts/validate_runtime.py
    - ./scripts/run_tests.sh --no-skips -m "requirement and live"
  after_script:
    - mkdir -p reports/ci
    - if [ -f reports/junit/results.xml ]; then cp reports/junit/results.xml reports/ci/requirements_live.xml; fi
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit/results.xml
    paths:
      - reports/

core_live:
  stage: core
  resource_group: api-core-live
  rules:
    # 仅同项目 MR 使用受保护线上变量；外部 fork 只执行契约门禁。
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  needs:
    - job: contract
      artifacts: false
  script:
    - python -m pip install .
    - python scripts/validate_runtime.py
    - ./scripts/run_tests.sh --no-skips -m "core and live"
  after_script:
    - mkdir -p reports/ci
    - if [ -f reports/junit/results.xml ]; then cp reports/junit/results.xml reports/ci/core_live.xml; fi
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit/results.xml
    paths:
      - reports/

feishu_daily_report:
  stage: notify
  resource_group: api-daily-notification
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: never
  needs:
    - job: contract
      artifacts: true
    - job: requirements_live
      artifacts: true
    - job: core_live
      artifacts: true
  script:
    - python scripts/notify_feishu.py --reports-dir reports/ci
  allow_failure: true
