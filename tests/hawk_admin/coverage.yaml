    name: done_end_empty_output
    display_name: 结束异常空输出导出
    marker: requirement
    source_schema: test-cases/hawk_admin/结束异常空输出_接口测试.schema.yaml
    cases:
      - {id: REQ-DONE-END-EMPTY-OUTPUT-API-01, source_id: EMPTY-OUTPUT-01, priority: P0, test: tests/hawk_admin/test_hawk_execution_api.py::test_hawk_10_10_allow_empty_output_from_done_end_alert, endpoint: "POST /api/v1/hawk/done-end-alert/allow-empty-output/{batchId}"}
