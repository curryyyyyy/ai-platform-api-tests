name: API Tests

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install .
      # Contract tests intentionally consume the committed snapshots.
      - name: Run contract suite
        run: ./scripts/run_tests.sh -m contract
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-reports
          path: reports/
          if-no-files-found: ignore

  requirements:
    name: Requirement live regression
    needs: contract
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      API_USER: ${{ secrets.API_USER }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      PLATFORM_BASE_URLS_JSON: ${{ secrets.PLATFORM_BASE_URLS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install .
      - name: Validate live test configuration
        run: python scripts/validate_runtime.py
      - name: Run requirement regression
        run: ./scripts/run_tests.sh --no-skips -m "requirement and live"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirement-live-reports
          path: reports/
          if-no-files-found: ignore

  core:
    name: Core live regression
    needs: contract
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      API_USER: ${{ secrets.API_USER }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      PLATFORM_BASE_URLS_JSON: ${{ secrets.PLATFORM_BASE_URLS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install .
      - name: Validate live test configuration
        run: python scripts/validate_runtime.py
      - name: Run P0 core regression
        run: ./scripts/run_tests.sh --no-skips -m "core and live"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-live-reports
          path: reports/
          if-no-files-found: ignore
