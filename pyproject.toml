[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform-api-tests"
version = "0.1.0"
description = "AI 总平台及各业务子平台接口自动化测试"
requires-python = ">=3.9"
dependencies = [
  "pytest>=8.0,<9",
  "requests>=2.31,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
  "cryptography>=41,<44",
  "allure-pytest>=2.13,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: 访问在线测试环境",
  "smoke: 主链路冒烟测试",
  "contract: OpenAPI 契约检查",
  "core: P0 核心回归用例，适合 CI 门禁",
  "hawk_admin: Hawk 机器标注子平台用例",
]

[tool.setuptools.packages.find]
include = ["framework*", "platforms*"]

# 类型检查必须指向项目虚拟环境，否则 pytest / allure / requests 等依赖无法解析，
# 会报出大量“无法解析导入”“属性未知”的假阳性。
[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
